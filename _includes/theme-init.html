<script>
  /* Apply the saved colour theme before first paint: "light" | "dark" | "system" (default). */
  (function () {
    var pref = "system";
    try { pref = localStorage.getItem("theme") || "system"; } catch (e) {}
    var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme-pref", pref);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
